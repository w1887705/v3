services:
  - type: web
    name: w1887705-maths-game-prototype
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: w1887705-maths-game-db
          property: connectionString

databases:
  - name: w1887705-maths-game-db
    plan: free
