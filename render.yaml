services:
  - type: web
    name: w1887705-maths-game-prototype
    env: python
    plan: free
    buildCommand: "bash build.sh"
    preDeployCommand: "python manage.py migrate && python manage.py seed_demo && python manage.py createsuperuser"
    startCommand: "gunicorn task10_project.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: w1887705-maths-game-db
          property: connectionString

databases:
  - name: w1887705-maths-game-db
    plan: free
